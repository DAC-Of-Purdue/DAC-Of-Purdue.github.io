<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>

  <div class="wrapper">
    <div
      class="footer-col-wrapper"
      style="
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      "
    >
      <div class="footer-col" style="width: 230px; align-self: center">
        <!-- <p class="feed-subscribe">
          <a href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}">
            <svg class="svg-icon orange">
              <use
                xlink:href="{{ 'assets/minima-social-icons.svg#rss' | relative_url }}"
              ></use>
            </svg>
            <span>Subscribe</span>
          </a>
        </p> -->
        <div class="social-links">{%- include social.html -%}</div>
        {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.name -%}
          <li class="p-name">{{ site.author.name | escape }}</li>
          {% endif -%} {% if site.author.email -%}
          <li>
            <a class="u-email" href="mailto:{{ site.author.email }}"
              >{{ site.author.email }}</a
            >
          </li>
          {%- endif %}
        </ul>
        {%- endif %}
      </div>
      <div class="footer-col" style="flex: 1 0; min-width: 250px">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>
  </div>
</footer>
